name: CI

# Runs on every push and pull request to main. The repository holds two test
# suites that nothing ran automatically, so a regression was only caught when
# somebody remembered to run them by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still going for the previous
# one, so a quick follow-up fix does not queue behind the commit it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project is developed against. Floating on
          # "stable" means an upstream release can fail the build on a day
          # nobody changed anything.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Two separate steps rather than one, so a failure names which half broke.
      - name: Analyze
        run: flutter analyze

      # Golden image tests are excluded: they were generated on Windows and
      # font rendering differs enough on Linux to fail a correct build. They
      # still run locally, where the images were produced.
      - name: Test
        run: flutter test --exclude-tags golden

  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime the functions declare, so a syntax or API
          # difference shows up here rather than at deploy.
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Syntax check every function file
        working-directory: functions
        run: |
          node --check index.js
          for f in src/services/*.js; do node --check "$f"; done

      - name: Test
        working-directory: functions
        run: npm test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The emulator refuses to start on anything below Java 21. The
      # development machine has Java 8, so these tests only run here until
      # that is upgraded locally.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # emulators:exec starts the emulator, runs the command against it, then
      # shuts it down and exits with the command's status.
      - name: Run rules tests
        working-directory: functions
        run: npm run test:rules
